name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/coreball
      - name: Tests
        run: pytest
      - name: CLI smoke
        run: |
          coreball inspect . --format markdown > /tmp/coreball-inspect.md
          coreball pack . --task "explain the selector" --max-tokens 2048 > /tmp/coreball-pack.md
      - name: Build
        run: python -m build

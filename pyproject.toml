[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coreball"
version = "0.1.0"
description = "A semantic compiler that packs the smallest useful codebase context for an LLM task."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "CoreBall contributors" }
]
keywords = ["llm", "code-analysis", "semantic-context", "rag", "developer-tools", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6.0",
  "mypy>=1.11",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/coreball/coreball"
Documentation = "https://github.com/coreball/coreball/tree/main/docs"
Issues = "https://github.com/coreball/coreball/issues"
Changelog = "https://github.com/coreball/coreball/blob/main/CHANGELOG.md"

[project.scripts]
coreball = "coreball.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coreball"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["coreball"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coreball"
version = "0.2.2"
description = "Semantic context compiler for LLM coding agents — packs the smallest useful codebase context for any task. Zero dependencies, deterministic, token-efficient."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "CoreBall contributors" }
]
keywords = [
  "context-engineering",
  "token-optimization",
  "llm",
  "ai-coding",
  "code-analysis",
  "code-understanding",
  "semantic-context",
  "context-compiler",
  "rag",
  "prompt-engineering",
  "context-window",
  "repository-analysis",
  "developer-tools",
  "ai-agents",
  "claude-code",
  "cursor",
  "codex",
  "code-graph",
  "knowledge-graph",
  "tree-sitter",
  "mcp",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6.0",
  "mypy>=1.11",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/francomano/coreball"
Documentation = "https://github.com/francomano/coreball/tree/main/docs"
Issues = "https://github.com/francomano/coreball/issues"
Changelog = "https://github.com/francomano/coreball/blob/main/CHANGELOG.md"

[project.scripts]
coreball = "coreball.cli:main"
coreball-mcp = "coreball.mcp_server:main"
coreball-api = "coreball.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coreball"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["coreball"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
